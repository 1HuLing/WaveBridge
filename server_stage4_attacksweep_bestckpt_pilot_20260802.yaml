  dct_channels: y
  delta: 0.002
  carrier_bands: [hh]
  narrow_band_search_for_low_payload: true
  dct_coefficients: auto56
  prefer_hh_only: true
  adaptive_strength: true
  texture_floor: 0.55
  texture_sharpness: 2.2
  texture_kernel: 17
  texture_abs_threshold: 0.003
  repetition_factor: 1
  dither_enabled: false
  dither_strength: 0.0
