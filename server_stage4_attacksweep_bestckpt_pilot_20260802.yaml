  target_raw_code_ber: 0.01
  target_jpeg50_ber: 0.01
  target_mixed_ber: 0.03
  min_cover_psnr: 36.0
  strength: 0.7
  llr_scale: 36.0
  llr_clamp: 20.0
  llr_polarity: 1.0
  position_mode: linear
  position_seed: 20260607
  clean_carrier_mode: none
  clean_carrier_seed: 20260607

robust_qim:
  enabled: false
  domain: dct
  dct_channels: y
  dct_coefficients: auto56
  dct_quality: 50
  dct_quant_scale: 1.0
