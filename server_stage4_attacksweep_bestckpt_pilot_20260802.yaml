    train_dir: dataset/BOSSbase_1.01
    val_dir: dataset/BOSSbase_1.01
    train_split: dataset/splits/bossbase/train.txt
    val_split: dataset/splits/bossbase/val.txt
    test_dir: dataset/BOSSbase_1.01
    test_split: dataset/splits/bossbase/val.txt

transmitter:
  chips_per_symbol: 32
  bit_depth: 4
  target_bpp: 0.30
  superpose_blocks: true
  group_size: 4
  chip_seed: 20260520
