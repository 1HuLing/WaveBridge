  soft_preview_quant: true
  soft_preview_blend: 0.80
  soft_quant_noise_scale: 0.08
  base_layer_soft_quant_scale: 0.04
  enhancement_soft_quant_scale: 0.08
  use_attention: true
  use_hyperprior_modulation: true
  hyperprior_channels: 80
  use_post_refiner: true
  post_refiner_scale: 0.12
  use_rgb_anchor: true
  codec_layout_version: rgb_anchor_residual_base_v2
  rgb_anchor_ll_mode: residual_base
  rgb_anchor_range: 0.95
  rgb_anchor_blend: 0.88
  rgb_anchor_max_blend: 0.94
  rgb_anchor_image_blend: 0.60
  ll_band_scale: 1.05
  hf_band_scale: 0.34
  ll_band_bias: 0.36
  clip_value: 3.0

datasets:
  active: div2k
  landscape:
    train_dir: dataset/Landscape
    val_dir:
    train_split:
    val_split:
    auto_split_ratio: 0.1
  div2k:
    train_dir: dataset/DIV2K/DIV2K_train_HR
    val_dir: dataset/DIV2K/DIV2K_valid_HR
    train_split:
    val_split:
  alaska2:
    train_dir: dataset/ALASKA2/jpeg_512_color_various_qf
    val_dir:
    train_split:
    val_split:
    auto_split_ratio: 0.1
    split_dir: dataset/splits/alaska2
